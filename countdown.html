<!DOCTYPE html>
<html>

<head>

<title>Waiting For Your Surprise ❤️</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(#ff9a9e,#fad0c4);
    font-family:Arial;
    text-align:center;
    color:white;
}

.box{
    background:white;
    color:#ff4b6e;
    padding:35px;
    border-radius:25px;
    width:80%;
}

h1{
    font-size:35px;
}

#timer{
    font-size:25px;
    font-weight:bold;
}

</style>

</head>


<body>

<div class="box">

<h1>🎁 Something Special Is Waiting ❤️</h1>

<p>
Nancu, your surprise will unlock on your birthday ✨
</p>

<h2 id="timer"></h2>

</div>


<script>

let birthday = new Date("August 18, 2026 00:00:00").getTime();


setInterval(function(){

let now = new Date().getTime();

let distance = birthday - now;


let days = Math.floor(distance/(1000*60*60*24));

let hours = Math.floor((distance%(1000*60*60*24))/(1000*60*60));

let minutes = Math.floor((distance%(1000*60*60))/(1000*60));

let seconds = Math.floor((distance%(1000*60))/1000);


document.getElementById("timer").innerHTML =
days+" Days "+hours+" Hours "+minutes+" Minutes "+seconds+" Seconds";


},1000);

</script>


</body>

</html>
