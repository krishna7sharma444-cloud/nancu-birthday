<!DOCTYPE html>
<html>

<head>
<title>Secret Birthday Surprise ❤️</title>

<style>

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(#141e30,#243b55);
    font-family:Arial;
    color:white;
    text-align:center;
}

.box{
    background:rgba(255,255,255,0.12);
    padding:45px 25px;
    border-radius:30px;
    width:85%;
    max-width:400px;
}

h1{
    font-size:40px;
}

p{
    font-size:20px;
    line-height:1.5;
}

input{
    width:80%;
    padding:18px;
    border-radius:30px;
    border:none;
    font-size:20px;
}

button{
    margin-top:25px;
    padding:18px 45px;
    border:none;
    border-radius:30px;
    background:#ff4b6e;
    color:white;
    font-size:20px;
}


</style>

</head>

<body>

<div class="box">

<h1>🎁 A Secret Surprise ❤️</h1>

<p>
This surprise is only for you...
</p>

<p>
Enter the secret code 🔒
</p>

<input id="password" placeholder="Password">

<br>

<button onclick="check()">
Unlock ❤️
</button>

<p id="msg"></p>

</div>


<script>

function check(){

let pass=document.getElementById("password").value;

if(pass=="0807"){

document.getElementById("msg").innerHTML =
"❤️ Password correct! Surprise unlocked soon...";

}

else{

document.getElementById("msg").innerHTML =
"Wrong code 🥺";

}

}

</script>

</body>

</html>
