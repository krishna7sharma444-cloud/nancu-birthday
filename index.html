<!DOCTYPE html>
<html>

<head>
<title>Secret Birthday Surprise ❤️</title>

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(#141e30,#243b55);
    font-family:Arial;
    color:white;
    text-align:center;
}

.box{
    background:rgba(255,255,255,0.1);
    padding:40px 25px;
    border-radius:25px;
    width:80%;
}

h1{
    font-size:35px;
}

input{
    padding:15px;
    border-radius:20px;
    border:none;
    text-align:center;
    font-size:18px;
}

button{
    margin-top:20px;
    padding:15px 30px;
    border:none;
    border-radius:25px;
    background:#ff4b6e;
    color:white;
    font-size:18px;
}

#msg{
    margin-top:20px;
}

</style>

</head>

<body>

<div class="box">

<h1>🎁 A Secret Surprise ❤️</h1>

<p>
This surprise is only for you...
</p>

<p>
Enter the secret code 🔒
</p>

<input id="password" placeholder="Password">

<br>

<button onclick="check()">
Unlock ❤️
</button>

<p id="msg"></p>

</div>


<script>

function check(){

let pass=document.getElementById("password").value;

if(pass=="0807"){

document.getElementById("msg").innerHTML =
"❤️ Password correct! Surprise unlocked soon...";

}

else{

document.getElementById("msg").innerHTML =
"Wrong code 🥺";

}

}

</script>

</body>

</html>
