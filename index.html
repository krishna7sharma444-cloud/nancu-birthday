<!DOCTYPE html>
<html>

<head>
<title>Secret Birthday Surprise ❤️</title>
    
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    
<style>

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(#141e30,#243b55);
    font-family:Arial;
    color:white;
    text-align:center;
}

.box{
    background:rgba(255,255,255,0.12);
    padding:45px 25px;
    border-radius:30px;
    width:85%;
    max-width:400px;
}

h1{
    font-size:40px;
}

p{
    font-size:20px;
    line-height:1.5;
}

input{
    width:80%;
    padding:18px;
    border-radius:30px;
    border:none;
    font-size:20px;
}

button{
    margin-top:25px;
    padding:18px 45px;
    border:none;
    border-radius:30px;
    background:#ff4b6e;
    color:white;
    font-size:20px;
}
body::before{
    content:"❤️ ❤️ ✨ ❤️ ✨ ❤️";
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    font-size:35px;
    opacity:0.15;
    animation:move 10s linear infinite;
    pointer-events:none;
}

@keyframes move{
    from{
        transform:translateY(100vh);
    }
    to{
        transform:translateY(-100vh);
    }
}

.box{
    animation:appear 1.5s ease;
}

@keyframes appear{
    from{
        opacity:0;
        transform:scale(0.8);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
    }

</style>

</head>

<body>

<div class="box">

<h1>🎁 A Secret Surprise ❤️</h1>

<p>
This surprise is only for you Nancu ❤️
Because you are someone really special to me ✨

</p>

<p>
Enter the secret code 🔒
</p>

<input id="password" placeholder="Password">

<br>

<button onclick="check()">
Unlock ❤️
</button>

<p id="msg"></p>

</div>


<script>

function check(){

let pass=document.getElementById("password").value;

if(pass=="1807"){

document.getElementById("msg").innerHTML =
"❤️ Welcome Nancu... Your surprise is waiting ✨";

setTimeout(function(){

window.location.href="countdown.html";

},2000);

    }

else{

document.getElementById("msg").innerHTML =
"Wrong code 🥺";

}

}

</script>

</body>

</html>
